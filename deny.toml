# cargo-deny configuration (checked by the "License + duplicate checks" CI job).
# Lint levels: deny = fail the check, warn = report only, allow = silent.

[advisories]
version = 2
# Advisories are owned by the `cargo audit` CI job (RustSec DB). This section is
# kept so `cargo deny check advisories` also works when run manually.
ignore = []

[licenses]
version = 2
# With version 2, any license NOT in this list is denied automatically — there is
# no separate `deny` list anymore. LGPL-2.1-or-later is allowed because its only
# user is `r-efi` (low-level EFI bindings, transitive, unmodified); strong
# copyleft (GPL/AGPL/GFDL/SSPL) is rejected by omission.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
# Workspace crates are unpublished (`publish = false` in each Cargo.toml) and
# carry no LICENSE file yet; skip their license checks rather than inventing one.
ignore = true

[bans]
# The lockfile carries ~25 duplicated crates (tokio, chrono, uuid, thiserror, ...);
# report them as warnings instead of failing until Dependabot/toolchain updates
# dedupe them.
multiple-versions = "warn"
# The workspace declares no `*` version requirements; ban them outright.
wildcards = "deny"
